<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>关于我们 - 小潮瓜子</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="container">
            <div class="logo">小潮瓜子</div>
            <ul class="nav-menu">
                <li><a href="index.html">首页</a></li>
                <li><a href="products.html">产品展示</a></li>
                <li><a href="about.html" class="active">关于我们</a></li>
                <li><a href="contact.html">联系我们</a></li>
            </ul>
        </div>
    </nav>

    <!-- 品牌故事 -->
    <section class="brand-story">
        <div class="container">
            <h2 class="section-title">品牌故事</h2>
            <div class="story-content">
                <p>1998年开店，坚持传统铁锅慢炒工艺，拒绝添加剂，用良心与手艺做街坊爱吃的炒货，近三十年的用心耕耘，收获无数小城人光临。</p>
            </div>
        </div>
    </section>

    <!-- 实体店信息 -->
    <section class="store-info">
        <div class="container">
            <h2 class="section-title">实体店信息</h2>
            <div class="store-address">
                <h3>地址</h3>
                <p>三门峡市湖滨区和平路梦之城对面向东 150 米小潮瓜子</p>
            </div>
            <div class="store-gallery-container">
                <div class="store-gallery-carousel">
                    <div class="carousel-wrapper store-gallery-wrapper">
                        <!-- 店铺图片将通过JavaScript动态加载 -->
                    </div>
                    <button class="carousel-btn prev">&lt;</button>
                    <button class="carousel-btn next">&gt;</button>
                </div>
            </div>
        </div>
    </section>

    <!-- 资质公示 -->
    <section class="qualifications">
        <div class="container">
            <h2 class="section-title">资质公示</h2>
            <div class="qualification-title">
                <span>合规经营 放心选购</span>
            </div>
            <div class="qualification-gallery">
                <!-- 资质图片将通过JavaScript动态加载 -->
            </div>
        </div>
    </section>

    <!-- 底栏 -->
    <footer class="footer">
        <div class="container">
            <div class="footer-info">
                <p class="address">地址：三门峡市湖滨区和平路梦之城对面向东 150 米小潮瓜子</p>
                <p class="phone">电话：13298271296</p>
            </div>
            <p class="copyright">© 2024 小潮瓜子 版权所有</p>
        </div>
    </footer>

    <script src="js/script.js"></script>

</html>

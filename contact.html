<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>联系我们 - 小潮瓜子</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="container">
            <div class="logo">小潮瓜子</div>
            <ul class="nav-menu">
                <li><a href="index.html">首页</a></li>
                <li><a href="products.html">产品展示</a></li>
                <li><a href="about.html">关于我们</a></li>
                <li><a href="contact.html" class="active">联系我们</a></li>
            </ul>
        </div>
    </nav>

    <!-- 联系方式 -->
    <section class="contact-info">
        <div class="container">
            <h2 class="section-title">联系方式</h2>
            <div class="phone-info">
                <h3>电话</h3>
                <p class="phone-number">13298271296</p>
                <p class="phone-note">添加店主微信同电话号码</p>
            </div>
        </div>
    </section>

    <!-- 二维码展示 -->
    <section class="qr-code">
        <div class="container">
            <div class="qr-container">
                <div class="qr-placeholder">
                    <img src="images/老板微信/豆包 (12).png" alt="老板微信二维码">
                </div>
                <p class="qr-note">扫码添加好友，咨询新品 / 到店福利</p>
            </div>
        </div>
    </section>

    <!-- 营业时间 -->
    <section class="business-hours">
        <div class="container">
            <h2 class="section-title">营业时间</h2>
            <div class="hours-content">
                <p>早上八点到晚上九点，春节期间延长至凌晨</p>
            </div>
        </div>
    </section>

    <!-- 到店指引 -->
    <section class="directions" id="address">
        <div class="container">
            <h2 class="section-title">到店指引</h2>
            <div class="directions-content">
                <h3>地址</h3>
                <p>三门峡市湖滨区和平路梦之城对面向东 150 米小潮瓜子</p>
            </div>
        </div>
    </section>

    <!-- 底栏 -->
    <footer class="footer">
        <div class="container">
            <div class="footer-info">
                <p class="address">地址：三门峡市湖滨区和平路梦之城对面向东 150 米小潮瓜子</p>
                <p class="phone">电话：13298271296</p>
            </div>
            <p class="copyright">© 2024 小潮瓜子 版权所有</p>
        </div>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
